[build-system]
requires = ["uv_build>=0.9.9"]
build-backend = "uv_build"

[project]
name = "opi5-max-llm-setup"
version = "0.1.0"
description = "Complete setup of local LLMs with RAG and REST API on Orange Pi 5 Max 16GB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.122.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "uvicorn>=0.35.0",
    "python-multipart>=0.0.20",
    # RAG dependencies
    "langchain>=0.3.25",
    "langchain-community>=0.3.27",
    "langchain-ollama>=0.3.0",
    "langchain-chroma>=0.2.4",
    "langchain-text-splitters>=0.3.8",
    "chromadb>=1.0.12",
    "sentence-transformers>=4.1.0",
    # Document processing
    "pypdf>=5.6.0",
    "pdfplumber>=0.11.6",
    "python-docx>=1.1.2",
    "unstructured>=0.17.2",
]

[project.scripts]
opi5-llm = "opi5_max_llm_setup.main:main"
opi5-server = "opi5_max_llm_setup.api.server:run_server"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.5",
    "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["opi5_max_llm_setup"]
