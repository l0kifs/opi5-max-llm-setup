# Docker Compose configuration for Orange Pi 5 Max LLM Setup
# This file provides an optional containerized deployment
#
# Usage:
#   docker compose --profile cpu up     # Start with Ollama (CPU)
#   docker compose --profile npu up     # Start with RKLLama (NPU)
#   docker compose up                   # Start with default (Ollama)

services:
  # Ollama LLM Server (CPU-based inference)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - cpu
      - default
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    # Note: On ARM64, ensure you use the ARM64 image
    # The official ollama/ollama image supports ARM64
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1

  # RKLLama LLM Server (NPU-accelerated inference for RK3588)
  # See: https://github.com/NotPunchnox/rkllama
  rkllama:
    image: ghcr.io/notpunchnox/rkllama:main
    container_name: rkllama
    profiles:
      - npu
    ports:
      - "8080:8080"
    volumes:
      - ./models:/root/RKLLAMA/models
    restart: unless-stopped
    # Privileged mode required for NPU access
    privileged: true
    environment:
      - RKLLAMA_MODEL_DIR=/root/RKLLAMA/models

  # RAG API Server
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - RKLLM_BASE_URL=http://rkllama:8080
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
      - UPLOAD_DIRECTORY=/app/data/uploads
    depends_on:
      ollama:
        condition: service_started
        required: false
      rkllama:
        condition: service_started
        required: false
    restart: unless-stopped
    # Memory limit recommendation for Orange Pi 5 Max
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  ollama-data:
    driver: local
